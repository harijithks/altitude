function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function weekEnd(extra){const d=new Date();d.setHours(12,0,0,0);const toSun=(7-d.getDay())%7;d.setDate(d.getDate()+toSun+7*extra);return ymd(d)}
function monthEnd(extra){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1+extra);d.setDate(0);return ymd(d)}
function colOf(t){if(!t.due)return'Pending';const today=td(),tm=addDays(1),we=weekEnd(0),nw=weekEnd(1),me=monthEnd(0);
