<script>
const KEY='altitude.v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function payAt(r,ym){let v=0,best='';(r.pay||[]).forEach(p=>{if(p.from<=ym&&p.from>=best){best=p.from;v=+p.amt||0}});return v}
function monthStats(r,ym){const a=AT(r),n=dim(ym),cnt={P:0,H:0,L:0,HD:0,A:0,U:0};let wd=0,paid=0,extra=0;
  for(let d=1;d<=n;d++){const ds=ym+'-'+String(d).padStart(2,'0'),st=a.days[ds],off=dayOff(ds);if(!off)wd++;if(st){cnt[st]++;const c=CRD[st];if(off)extra+=c;else paid+=c}}
  return{wd,cnt,paid,extra,marked:Object.keys(a.days).some(k=>k.startsWith(ym))}}
function calcPay(r,ym){const a=AT(r),st=monthStats(r,ym),basic=payAt(r,ym),
  fx=a.ben.filter(b=>b.k!='att').reduce((s,b)=>s+(+b.amt||0),0),
  at=a.ben.filter(b=>b.k=='att').reduce((s,b)=>s+(+b.amt||0),0),
  ded=a.ded.reduce((s,b)=>s+(+b.amt||0),0),
  f=st.marked&&st.wd?Math.min(1,st.paid/st.wd):null,estimate=f===null,fac=estimate?1:f,
  gross=basic*fac+at*fac+fx,net=Math.max(0,gross-ded),
  rec=a.set.filter(x=>x.ym==ym).reduce((s,x)=>s+(+x.amt||0),0),bal=net-rec;
  return{basic,fx,at,ded,f,estimate,fac,gross,net,rec,bal,st}}
function monthsOf(r){const a=AT(r),s=new Set(Object.keys(a.days).map(k=>k.slice(0,7)));a.set.forEach(x=>s.add(x.ym));return [...s].sort()}
function dues(){const out=[];RL().forEach(r=>monthsOf(r).forEach(ym=>{const c=calcPay(r,ym);if(!c.estimate&&c.bal>0.5)out.push({r,ym,c})}));return out}
function attSummary(){let recAll=0;RL().forEach(r=>AT(r).set.forEach(x=>{recAll+=(+x.amt||0)}));const d=dues();return{out:d.reduce((s,x)=>s+x.c.bal,0),pend:d,recAll}}
function attAlerts(){return dues().map(x=>({k:'pay'+x.r.id+x.ym,ty:'wa',t:x.r.org+' · '+mlabel(x.ym),m:'Salary balance '+inr(x.c.bal)+' still to be received',v:'att',id:x.r.id+'|'+x.ym}))}
function attDash(){const s=attSummary(),now=td().slice(0,7);let pres=0,wd=0;

  const totRec=a.set.reduce((s,x)=>s+(+x.amt||0),0);
  const legend=['P','H','A','L','HD','U'].map(k=>`<span><i style="background:${LC[k]}"></i>${SC_S[k]}</span>`).join('');
  const fac=c.estimate?100:Math.round(c.fac*100);
  return `<div class="ph"><h2>Attendance &amp; Pay</h2></div>
<div class="tabs">${chips}</div>
<div class="card" style="padding:14px"><div class="r2" style="justify-content:space-between;flex-wrap:nowrap"><b>Year ${yy}</b></div><div class="yr" style="margin-top:8px">${yr}</div></div>
<div class="card" style="padding:14px"><div class="r2" style="justify-content:space-between;flex-wrap:nowrap"><button class="ic" data-a="amv" data-v="-1" aria-label="Previous month">‹</button><b style="font-size:16px">${mlabel(ym)}</b><button class="ic" data-a="amv" data-v="1" aria-label="Next month">›</button></div>
<div class="kp" style="margin:12px 0 0"><div class="card" style="padding:10px"><small>Present</small><b>${cnt.P}</b></div><div class="card" style="padding:10px"><small>Half days</small><b>${cnt.H}</b></div><div class="card" style="padding:10px"><small>Absent</small><b>${cnt.A}</b></div><div class="card" style="padding:10px"><small>Leave / holiday</small><b>${cnt.L+cnt.HD}</b></div><div class="card" style="padding:10px"><small>Attendance</small><b>${st.wd?Math.round(st.paid/st.wd*100):0}%</b><small>${st.paid} of ${st.wd} working days${st.extra?' · '+st.extra+' Sunday':''}</small></div></div>
<div class="legend" style="margin:10px 0">${legend}</div>
<div class="cal">${ATW.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
<div class="r2" style="margin-top:12px;gap:8px"><button class="btn sm gh" data-a="abulk">Mark weekdays present</button><button class="btn sm gh" data-a="aclr" data-id="${r.id}" style="color:var(--er)">Clear month</button></div>
