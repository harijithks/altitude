name: Altitude job watch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check applications
        env:
          JOBS_JSON: ${{ secrets.JOBS_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch/watch.py

      - name: Save state
        run: |
          git config user.name "altitude-watch"
          git config user.email "watch@users.noreply.github.com"
          git add -A watch
          git commit -m "watch: update state" || echo "no changes"
          git push
